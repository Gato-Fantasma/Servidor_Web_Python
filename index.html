<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servidor Iniciado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50c9c3);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin-top: 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Servidor Iniciado</h1>
        <p>Um servidor HTTP simples em Python.</p>
    </div>
</body>
</html>
